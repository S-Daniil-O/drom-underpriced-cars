name: torgi-health
# Проверка здоровья сбора торгов: площадка не ответила / лотов резко меньше / iMac не прислал данные.
# Пишет владельцу в личку только при проблеме. Запускается после публикации (torgi-post) и раз в день в 12:30 МСК.
on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: [torgi-post]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: torgi-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TORGI_BOT_TOKEN: ${{ secrets.TORGI_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/checkout@v4
        with: {ref: inbox, path: _inbox}
      - uses: actions/checkout@v4
        with: {ref: state, path: _state}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python torgi/health.py _inbox/inbox _state
      - name: сохранить
        if: always()
        run: |
          cd _state
          git config user.name "monitor-bot"; git config user.email "monitor-bot@users.noreply.github.com"
          git add torgi_health.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "state: проверка здоровья"
          for i in 1 2 3 4 5; do git push origin HEAD:state && exit 0; git pull --rebase origin state; done; exit 1
