name: probe-market

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: probe Avito + Auto.ru
        run: python probe_market.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-out
          path: probe_out/
