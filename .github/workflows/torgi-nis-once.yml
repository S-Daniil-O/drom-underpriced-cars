name: torgi-nis-once
# Разово: закрепить навигацию и выложить лоты НИС, не дожидаясь iMac. Дальше канал ведёт iMac.
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: torgi-post
  cancel-in-progress: false
jobs:
  n:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TORGI_BOT_TOKEN: ${{ secrets.TORGI_BOT_TOKEN }}
      TORGI_CHAT_ID: ${{ vars.TORGI_NIS_CHAT_ID }}
      TORGI_STATE_PUSH: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/checkout@v4
        with: {ref: state, path: _state}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: навигация
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          T, C = os.environ["TORGI_BOT_TOKEN"], os.environ["TORGI_CHAT_ID"]
          def call(m, **d):
              return json.load(urllib.request.urlopen(urllib.request.Request(f"https://api.telegram.org/bot{T}/{m}", data=urllib.parse.urlencode(d).encode()), timeout=30))
          me = call("getMe")["result"]["id"]
          st = call("getChatMember", chat_id=C, user_id=me)["result"]
          print("бот в канале:", st.get("status"), "| постить:", st.get("can_post_messages"), "| закреплять:", st.get("can_pin_messages", "—"))
          r = call("sendMessage", chat_id=C, text=open("torgi/once/pin_nis.txt").read(), disable_notification="true")
          mid = r["result"]["message_id"]
          try:
              print("закреплено:", call("pinChatMessage", chat_id=C, message_id=mid, disable_notification="true").get("ok"))
          except Exception as e:
              print("закрепить не удалось:", type(e).__name__)
          PY
      - name: сбор
        run: |
          mkdir -p _state/torgi_nis
          test -f _state/torgi_nis/posted.json || echo '{}' > _state/torgi_nis/posted.json
          TORGI_POSTED_FILE=_state/torgi_nis/posted.json python torgi/torgi_monitor.py --source=nis --queue=_q --active=_q/active.json
      - name: публикация
        run: python torgi/post_queue.py _q _state/torgi_nis/posted.json
      - name: сохранить
        if: always()
        run: |
          cd _state
          git config user.name "monitor-bot"; git config user.email "monitor-bot@users.noreply.github.com"
          git add torgi_nis 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "state(torgi_nis): posted"
          for i in 1 2 3 4 5; do git push origin HEAD:state && exit 0; git pull --rebase origin state; done; exit 1
