name: torgi-fav-diag
# Разово, ничего не меняет: какие сообщения сейчас есть в группе.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  d:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.TORGI_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: state, path: _state}
      - run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.parse, urllib.error
          T = os.environ["T"]
          def call(m, **d):
              for _ in range(4):
                  try:
                      return json.load(urllib.request.urlopen(urllib.request.Request(f"https://api.telegram.org/bot{T}/{m}", data=urllib.parse.urlencode(d).encode()), timeout=30))
                  except urllib.error.HTTPError as e:
                      r = json.load(e)
                      if r.get("error_code") == 429:
                          time.sleep(r.get("parameters", {}).get("retry_after", 5) + 1); continue
                      return r
                  except (urllib.error.URLError, OSError):
                      time.sleep(5)
              return {"description": "сеть"}
          st = json.load(open("_state/torgi_fav/favs.json"))
          F = st["forum"]
          # editMessageLiveLocation не меняет обычные сообщения: «can't be edited» = есть, «not found» = нет
          exist, gone, other = [], 0, {}
          for mid in range(1, 560):
              d = call("editMessageLiveLocation", chat_id=F, message_id=mid, latitude="0", longitude="0").get("description", "")
              if "not found" in d: gone += 1
              elif "can't be edited" in d or "can not be edited" in d or "isn't" in d: exist.append(mid)
              else: other[d[:50]] = other.get(d[:50], 0) + 1
              time.sleep(0.12)
          print("ИТОГ есть сообщений:", len(exist), "| нет:", gone, "| прочее:", other)
          print("ИТОГ номера:", exist[:150])
          cards = {v["n"]: v["card"] for v in st["lots"].values() if v.get("topic") and not v.get("removed")}
          print("ИТОГ карточек уцелело:", [n for n, c in cards.items() if c in exist], "из", len(cards))
          PY
