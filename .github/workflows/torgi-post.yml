name: torgi-post

# Публикация банкротных торгов: все выгодные — в @torgi_vrn_ss, горящие (скоро конец,
# цена у минимума) — в закрытый канал «Крайние предложения торги» (id в переменной
# репозитория TORGI_HOT_CHAT_ID).
# Очередь (inbox/torgi/queue.json + фото) каждый день кладёт домашний iMac
# в ветку inbox. Этот файл лежит и в main (ручной запуск), и в ветке inbox —
# там он срабатывает на push очереди (workflow для push берётся из пушнутого коммита).
on:
  push:
    branches: [inbox]
    paths: ["inbox/torgi/queue.json", "inbox/torgi_hot/queue.json", "inbox/torgi/active.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: torgi-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TORGI_BOT_TOKEN: ${{ secrets.TORGI_BOT_TOKEN }}
      PYTHONUNBUFFERED: "1"
      TORGI_STATE_PUSH: "1"   # post_queue.py сохраняет posted.json в state после каждой пачки
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: inbox
          path: _inbox
      - uses: actions/checkout@v4
        with:
          ref: state
          path: _state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: cleanup — убрать неактуальные посты (торги закончились / лот снят / далеко)
        env:
          HOT: ${{ vars.TORGI_HOT_CHAT_ID }}
        run: |
          A=_inbox/inbox/torgi/active.json
          if [ -f "$A" ]; then
            [ -n "$HOT" ] && [ -f _state/torgi_hot/posted.json ] && TORGI_CHAT_ID="$HOT" python torgi/post_queue.py --cleanup "$A" _state/torgi_hot/posted.json || true
            python torgi/post_queue.py --cleanup "$A" _state/torgi/posted.json || true
          fi
      - name: publish hot (Крайние предложения торги)
        if: vars.TORGI_HOT_CHAT_ID != ''
        env:
          TORGI_CHAT_ID: ${{ vars.TORGI_HOT_CHAT_ID }}
        run: |
          mkdir -p _state/torgi_hot
          test -f _state/torgi_hot/posted.json || echo '{}' > _state/torgi_hot/posted.json
          python torgi/post_queue.py _inbox/inbox/torgi_hot _state/torgi_hot/posted.json
      - name: publish
        if: always()
        run: |
          mkdir -p _state/torgi
          test -f _state/torgi/posted.json   # без posted.json нельзя: будут повторы
          python torgi/post_queue.py _inbox/inbox/torgi _state/torgi/posted.json
      - name: save posted.json to state branch
        if: always()
        run: |
          cd _state
          git add -N torgi_hot/posted.json torgi/cleaned.json torgi_hot/cleaned.json 2>/dev/null || true
          if git status --porcelain torgi torgi_hot | grep -q .; then
            git config user.name "monitor-bot"
            git config user.email "monitor-bot@users.noreply.github.com"
            git add torgi/posted.json
            [ -f torgi_hot/posted.json ] && git add torgi_hot/posted.json || true
            git add torgi/cleaned.json torgi_hot/cleaned.json 2>/dev/null || true
            git commit -m "state(torgi): posted"
            for i in 1 2 3 4 5; do
              git push origin HEAD:state && exit 0
              git pull --rebase origin state
            done
            exit 1
          fi
