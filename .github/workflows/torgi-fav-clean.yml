name: torgi-fav-clean
# Разово: удалить в «Моих лотах» всё, кроме карточек лотов (карточка и строка «МОЙ ЛОТ» за ней).
on: workflow_dispatch
jobs:
  c:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.TORGI_BOT_TOKEN }}
      CHAT: ${{ vars.TORGI_FAV_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: state, path: _state}
      - run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.parse, urllib.error
          T, CHAT = os.environ["T"], os.environ["CHAT"]
          def call(m, **d):
              try:
                  return json.load(urllib.request.urlopen(urllib.request.Request(f"https://api.telegram.org/bot{T}/{m}", data=urllib.parse.urlencode(d).encode()), timeout=30))
              except urllib.error.HTTPError as e:
                  return json.load(e)
          lots = json.load(open("_state/torgi_fav/favs.json"))["lots"]
          keep = set()
          for v in lots.values():
              if not v.get("removed"):
                  keep |= {v["card"], v["card"] + 1}
          probe = call("sendMessage", chat_id=CHAT, text="·", disable_notification="true")["result"]["message_id"]
          ok = gone = old = 0
          for mid in range(2, probe + 1):
              if mid in keep: continue
              r = call("deleteMessage", chat_id=CHAT, message_id=mid)
              d = r.get("description", "")
              if r.get("ok"): ok += 1
              elif "not found" in d: gone += 1
              else: old += 1
              time.sleep(0.4)
          print(f"ИТОГ лотов {len(lots)}, оставлено {len(keep)}, удалено {ok}, уже не было {gone}, не удалось (старше 48 ч) {old}")
          PY
