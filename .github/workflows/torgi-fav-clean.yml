name: torgi-fav-clean
# Разово: удалить в «Моих лотах» всё, кроме карточек лотов (3, 4, 5), и вернуть напоминание по лоту №1.
on: workflow_dispatch
jobs:
  c:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.TORGI_BOT_TOKEN }}
      CHAT: ${{ vars.TORGI_FAV_CHAT_ID }}
    steps:
      - run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.parse, urllib.error
          T, CHAT = os.environ["T"], os.environ["CHAT"]
          def call(m, **d):
              try:
                  return json.load(urllib.request.urlopen(urllib.request.Request(f"https://api.telegram.org/bot{T}/{m}", data=urllib.parse.urlencode(d).encode()), timeout=30))
              except urllib.error.HTTPError as e:
                  return json.load(e)
          probe = call("sendMessage", chat_id=CHAT, text="·", disable_notification="true")["result"]["message_id"]
          keep = {3, 4, 5}
          ok = 0
          for mid in range(6, probe + 1):
              if mid in keep: continue
              r = call("deleteMessage", chat_id=CHAT, message_id=mid)
              ok += bool(r.get("ok"))
              time.sleep(0.4)
          print("удалено сообщений:", ok, "из", probe - 5)
          r = call("sendMessage", chat_id=CHAT, reply_to_message_id=3,
                   text="⏰ Лот №1 Chevrolet Niva, 2015: приём заявок заканчивается 02.11.2026 18:00 МСК — меньше чем через 24 ч.\nhttps://torgi.cdtrf.ru/trades/387921")
          print("напоминание по лоту №1:", r.get("ok"))
          PY
