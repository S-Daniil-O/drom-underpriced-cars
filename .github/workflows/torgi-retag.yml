name: torgi-retag
# Разово: добавить хэштеги/пометку СУПЕРЦЕНА в уже опубликованные посты
# (правки готовятся заранее в torgi/retag_edits.json: chat, message_id, text, photo).
on: workflow_dispatch
jobs:
  retag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TORGI_BOT_TOKEN: ${{ secrets.TORGI_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.parse, urllib.error
          T = os.environ["TORGI_BOT_TOKEN"]
          def call(method, data):
              req = urllib.request.Request(f"https://api.telegram.org/bot{T}/{method}", data=urllib.parse.urlencode(data).encode())
              try:
                  return json.load(urllib.request.urlopen(req, timeout=30))
              except urllib.error.HTTPError as e:
                  return json.load(e)
          ok = skip = fail = 0
          for e in json.load(open("torgi/retag_edits.json")):
              base = {"chat_id": e["chat"], "message_id": e["message_id"]}
              for attempt in range(5):
                  if e["photo"]:
                      r = call("editMessageCaption", {**base, "caption": e["text"]})
                  else:
                      r = call("editMessageText", {**base, "text": e["text"], "disable_web_page_preview": "true"})
                  d = r.get("description", "")
                  if not r.get("ok") and "no caption" in d:
                      e["photo"] = False; continue
                  if not r.get("ok") and "text in the message to edit" in d:
                      e["photo"] = True; continue
                  if r.get("error_code") == 429:
                      time.sleep(r.get("parameters", {}).get("retry_after", 5) + 1); continue
                  break
              if r.get("ok"): ok += 1
              elif "not modified" in d: skip += 1
              else:
                  fail += 1; print("ошибка", e["chat"], e["message_id"], d)
              time.sleep(1.2)
          print(f"исправлено: {ok}, уже были: {skip}, ошибок: {fail}")
          PY
