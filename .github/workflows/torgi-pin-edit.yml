name: torgi-pin-edit
# Разово: в закреплённую навигацию — строка про #завершено (замена строки «Когда торги…»).
on: workflow_dispatch
jobs:
  e:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.TORGI_BOT_TOKEN }}
      HOT: ${{ vars.TORGI_HOT_CHAT_ID }}
    steps:
      - run: |
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.parse, urllib.error
          T = os.environ["T"]
          def call(m, d):
              try:
                  return json.load(urllib.request.urlopen(urllib.request.Request(f"https://api.telegram.org/bot{T}/{m}", data=urllib.parse.urlencode(d).encode()), timeout=30))
              except urllib.error.HTTPError as e:
                  return json.load(e)
          NEW = "Когда торги по лоту заканчиваются, пост остаётся с пометкой #завершено (в поиске по остальным хэштегам его уже не будет). Лоты из регионов дальше 1000 км удаляются или помечаются #далеко."
          for name, chat, mid in (("основной", "@torgi_vrn_ss", 852), ("горящие", os.environ["HOT"], 245)):
              r = call("forwardMessage", {"chat_id": chat, "from_chat_id": chat, "message_id": mid, "disable_notification": "true"})
              if not r.get("ok"):
                  print(name, "не прочитать текст", r.get("description")); continue
              text = r["result"].get("text", ""); call("deleteMessage", {"chat_id": chat, "message_id": r["result"]["message_id"]})
              text = re.sub(r"Когда (торги по лоту|приём заявок) заканчиваю?тся[^\n]*", NEW, text)
              e = call("editMessageText", {"chat_id": chat, "message_id": mid, "text": text})
              print(name, e.get("ok"), e.get("description", ""))
          PY
