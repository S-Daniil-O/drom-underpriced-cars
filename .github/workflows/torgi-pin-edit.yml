name: torgi-pin-edit
# Разово: обновить текст закреплённой навигации в обоих каналах.
on: workflow_dispatch
jobs:
  e:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.TORGI_BOT_TOKEN }}
      HOT: ${{ vars.TORGI_HOT_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse, urllib.error
          T = os.environ["T"]
          for name, chat, mid, f in (("основной", "@torgi_vrn_ss", 852, "torgi/once/pin_main.txt"),
                                     ("горящие", os.environ["HOT"], 245, "torgi/once/pin_hot.txt")):
              req = urllib.request.Request(f"https://api.telegram.org/bot{T}/editMessageText",
                    data=urllib.parse.urlencode({"chat_id": chat, "message_id": mid, "text": open(f).read()}).encode())
              try:
                  r = json.load(urllib.request.urlopen(req, timeout=30))
              except urllib.error.HTTPError as e:
                  r = json.load(e)
              print(name, r.get("ok"), r.get("description", ""))
          PY
