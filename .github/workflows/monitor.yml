name: monitor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: [main, k500]
    concurrency:
      group: monitor-${{ matrix.profile }}
      cancel-in-progress: false
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      PEREKUP_CHAT_ID: ${{ secrets.PEREKUP_CHAT_ID }}
      VK_TOKEN: ${{ secrets.VK_TOKEN }}
      VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
      TELEGRAM_CHAT_ID: ${{ matrix.profile == 'main' && secrets.TELEGRAM_CHAT_ID_MAIN || secrets.TELEGRAM_CHAT_ID_K500 }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: checkout state branch
        uses: actions/checkout@v4
        with:
          ref: state
          path: _state

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium

      - name: restore price history (cache)
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.profile }}/data/price_history.json
          key: ph-${{ matrix.profile }}-none
          restore-keys: ph-${{ matrix.profile }}-

      - name: prepare data
        run: |
          set -e
          P=${{ matrix.profile }}
          mkdir -p $P/data
          test -f _state/$P/posted.json   # без posted.json запускаться нельзя: будут повторные публикации
          cp _state/$P/posted.json $P/data/posted.json
          if [ -f _state/$P/teaser.json ]; then cp _state/$P/teaser.json $P/data/teaser.json; fi
          if [ ! -f $P/data/price_history.json ]; then
            echo "кэш пуст — берём стартовую историю цен из ветки state"
            cp _state/$P/price_history.seed.json $P/data/price_history.json
          fi

      - name: run monitor
        working-directory: ${{ matrix.profile }}
        env:
          PYTHONPATH: .
        run: python ../monitor.py

      - name: save price history (cache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ matrix.profile }}/data/price_history.json
          key: ph-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: persist state (posted.json, teaser.json) to state branch
        if: always()
        run: |
          P=${{ matrix.profile }}
          changed=0
          for F in posted.json teaser.json; do
            if [ -f $P/data/$F ] && ! cmp -s $P/data/$F _state/$P/$F 2>/dev/null; then
              cp $P/data/$F _state/$P/$F
              changed=1
            fi
          done
          if [ "$changed" = 1 ]; then
            cd _state
            git config user.name "monitor-bot"
            git config user.email "monitor-bot@users.noreply.github.com"
            git add $P/posted.json
            [ -f $P/teaser.json ] && git add $P/teaser.json || true
            git commit -m "state($P): posted/teaser"
            for i in 1 2 3 4 5; do
              git push origin HEAD:state && exit 0
              git pull --rebase origin state
            done
            exit 1
          fi

  # Цепочка: cron у GitHub срабатывает раз в несколько часов, поэтому после
  # каждого прогона ждём, пока с его начала пройдёт 15 минут, и запускаем
  # следующий. cron остаётся как страховка на случай обрыва цепочки.
  # Остановить цепочку: отменить текущий запуск или `gh workflow disable monitor.yml`.
  next:
    needs: run
    if: ${{ always() && needs.run.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: подождать до 15 минут от старта и запустить следующий прогон
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STARTED=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .run_started_at)
          echo "старт прогона: $STARTED"
          start=$(date -d "$STARTED" +%s); now=$(date +%s)
          wait=$(( 900 - (now - start) ))
          if [ "$wait" -gt 0 ]; then echo "жду ${wait} с"; sleep "$wait"; fi
          # Защита от размножения цепочек (например, запоздавший cron запускает ещё одну):
          # продолжает цепочку только самый новый из активных запусков, остальные выходят.
          NEWEST=$(gh run list --repo "${{ github.repository }}" --workflow monitor.yml --limit 30 --json databaseId,status \
            --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="pending" or .status=="waiting") | .databaseId] | max')
          if [ "$NEWEST" != "${{ github.run_id }}" ]; then
            echo "есть более новый активный запуск ($NEWEST) — цепочку продолжает он"
            exit 0
          fi
          gh workflow run monitor.yml --repo "${{ github.repository }}" --ref main
