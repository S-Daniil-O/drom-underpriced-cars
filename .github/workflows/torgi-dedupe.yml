name: torgi-dedupe
# Разово (21.10.2026): удалить ранние копии 20 постов, повторно вышедших после
# отменённой публикации 20.10 (в posted.json записаны поздние копии — их оставляем).
on: workflow_dispatch
jobs:
  dedupe:
    runs-on: ubuntu-latest
    env:
      TORGI_BOT_TOKEN: ${{ secrets.TORGI_BOT_TOKEN }}
    steps:
      - run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse, urllib.error
          T = os.environ["TORGI_BOT_TOKEN"]; ok = 0
          for mid in range(532, 552):
              req = urllib.request.Request(f"https://api.telegram.org/bot{T}/deleteMessage",
                    data=urllib.parse.urlencode({"chat_id": "@torgi_vrn_ss", "message_id": mid}).encode())
              try:
                  r = json.load(urllib.request.urlopen(req, timeout=30))
              except urllib.error.HTTPError as e:
                  r = json.load(e)
              ok += bool(r.get("ok")); print(mid, r.get("ok"), r.get("description", ""))
          print("удалено:", ok)
          PY
